name: Playwright Automation Tests & Reports

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    # 1. Copiar el repositorio usando la versión corregida (sin advertencias de Node)
    - uses: actions/checkout@v4.2.2

    # 2. Configurar Node.js y activar la caché de npm para acelerar la instalación
    - uses: actions/setup-node@v4.1.0
      with:
        node-version: lts/*
        cache: 'npm'

    # 3. Instalar dependencias del proyecto de manera limpia
    - name: Install dependencies
      run: npm ci

    # 4. Instalar los navegadores de Playwright con sus dependencias del sistema
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # 5. Ejecutar las pruebas generando el JSON necesario para el resumen visual
    - name: Run Playwright tests
      run: npx playwright test --reporter=html,list,json=report.json
      env:
        CI: true

    # 6. Publicar la tabla resumen estética directamente en el "Job Summary" de GitHub Actions
    - name: Generate Visual Report Summary
      uses: jejacks0n/playwright-report-summary-action@v0.0.3
      if: always() # Se ejecuta siempre, incluso si fallan las pruebas anteriores
      with:
        json-file: report.json

    # 7. Subir el reporte HTML completo (con capturas, videos y trazas) como artefacto descargable
    - name: Upload Full HTML Report Artifact
      uses: actions/upload-artifact@v4.4.3
      if: always() # Asegura que las evidencias se suban ante cualquier fallo
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30 # Mantiene el reporte disponible por 30 días
